services:
  # ── Nginx HTTPS 反向代理 ──────────────────────────────
  nginx:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/registry.k8s.io/nginx-slim:0.21
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot-www:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # ── TaskPilot 应用 ────────────────────────────────────
  app:
    build: .
    expose:
      - "6060"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',6060)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
