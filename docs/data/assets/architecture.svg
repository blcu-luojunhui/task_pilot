<svg width="100%" viewBox="0 0 720 840" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F4FA"/>
      <stop offset="100%" stop-color="#ECEBF3"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAFD"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEE5FA"/>
      <stop offset="100%" stop-color="#E8ECF6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBFBFE"/>
    </linearGradient>
    <linearGradient id="infra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDECF4"/>
      <stop offset="100%" stop-color="#E4E3EC"/>
    </linearGradient>
    <filter id="s1" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1E2A4A" flood-opacity="0.05"/>
    </filter>
    <filter id="s2" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#3A4FA0" flood-opacity="0.06"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8E99BB" stroke-width="1.3" stroke-linecap="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", sans-serif; }
    .t1 { font-size: 14px; font-weight: 600; fill: #2A3363; }
    .t2 { font-size: 11px; fill: #858CAA; }
    .b1 { font-size: 13px; font-weight: 600; fill: #323B6E; }
    .b2 { font-size: 11px; fill: #606894; }
    .lb { font-size: 10.5px; fill: #858CAA; letter-spacing: 0.6px; }
  </style>

  <rect width="720" height="840" rx="16" fill="url(#bg)"/>

  <!-- ══════ L1 api ══════ -->
  <rect x="80" y="40" width="560" height="52" rx="12" fill="url(#layer)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <rect x="80" y="44" width="3" height="44" rx="1.5" fill="#6B7DDB"/>
  <text x="360" y="62" text-anchor="middle" class="t1">api</text>
  <text x="360" y="81" text-anchor="middle" class="t2">HTTP 接入 · auth · chat · tasks · skills · health · replay</text>
  <line x1="360" y1="92" x2="360" y2="120" stroke="#A1AFCB" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ══════ L2 jobs ══════ -->
  <rect x="80" y="122" width="560" height="52" rx="12" fill="url(#layer)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <rect x="80" y="126" width="3" height="44" rx="1.5" fill="#6B7DDB"/>
  <text x="360" y="144" text-anchor="middle" class="t1">jobs</text>
  <text x="360" y="163" text-anchor="middle" class="t2">任务引擎 · MySQL 状态机 · 并发控制 · 超时/取消 · 优雅关闭</text>
  <line x1="360" y1="174" x2="360" y2="204" stroke="#A1AFCB" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ══════ L3 core/agents ══════ -->
  <rect x="80" y="206" width="560" height="400" rx="16" fill="url(#core)" stroke="#A1AFCB" stroke-width="1.2" filter="url(#s2)"/>
  <rect x="80" y="210" width="4" height="392" rx="2" fill="#4C5FD5"/>
  <text x="360" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#242F65">core / agents</text>
  <text x="360" y="256" text-anchor="middle" class="t2">Agent 智能引擎</text>

  <!-- Row 1 headers -->
  <text x="176" y="288" text-anchor="middle" class="lb">决策与编排</text>
  <text x="362" y="288" text-anchor="middle" class="lb">能力</text>
  <text x="548" y="288" text-anchor="middle" class="lb">状态</text>

  <!-- Boxes: 3×180, gaps 6, x = 86/272/458, centers = 176/362/548 -->
  <!-- engine -->
  <rect x="86" y="298" width="180" height="160" rx="10" fill="url(#card)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <text x="176" y="322" text-anchor="middle" class="b1">engine</text>
  <text x="176" y="346" text-anchor="middle" class="b2">Loop / Runner</text>
  <text x="176" y="368" text-anchor="middle" class="b2">ReAct / PlanExecute / Reflexion</text>
  <text x="176" y="390" text-anchor="middle" class="b2">Prompt Assembler / Knowledge</text>
  <text x="176" y="412" text-anchor="middle" class="b2">Lifecycle</text>
  <text x="176" y="434" text-anchor="middle" class="b2">Types</text>

  <!-- capabilities -->
  <rect x="272" y="298" width="180" height="160" rx="10" fill="url(#card)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <text x="362" y="322" text-anchor="middle" class="b1">capabilities</text>
  <text x="362" y="346" text-anchor="middle" class="b2">LLM Provider</text>
  <text x="362" y="368" text-anchor="middle" class="b2">Skill Executor</text>
  <text x="362" y="390" text-anchor="middle" class="b2">MCP Loader</text>
  <text x="362" y="412" text-anchor="middle" class="b2">Tool Adapter</text>
  <text x="362" y="434" text-anchor="middle" class="b2">OpenAI / Claude 双格式</text>

  <!-- state -->
  <rect x="458" y="298" width="180" height="160" rx="10" fill="url(#card)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <text x="548" y="322" text-anchor="middle" class="b1">state</text>
  <text x="548" y="346" text-anchor="middle" class="b2">State Machine</text>
  <text x="548" y="368" text-anchor="middle" class="b2">Memory（短期 + 长期）</text>
  <text x="548" y="390" text-anchor="middle" class="b2">Context Window Manager</text>
  <text x="548" y="412" text-anchor="middle" class="b2">Snapshot</text>
  <text x="548" y="434" text-anchor="middle" class="b2">Artifact</text>

  <!-- Row 2 headers -->
  <text x="176" y="488" text-anchor="middle" class="lb">执行</text>
  <text x="362" y="488" text-anchor="middle" class="lb">运行时</text>
  <text x="548" y="488" text-anchor="middle" class="lb">multi-agents</text>

  <!-- execution -->
  <rect x="86" y="498" width="180" height="86" rx="10" fill="url(#card)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <text x="176" y="520" text-anchor="middle" class="b1">execution</text>
  <text x="176" y="543" text-anchor="middle" class="b2">Dispatcher · Router</text>
  <text x="176" y="566" text-anchor="middle" class="b2">Budget · Cancel Signal</text>

  <!-- runtime -->
  <rect x="272" y="498" width="180" height="86" rx="10" fill="url(#card)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <text x="362" y="520" text-anchor="middle" class="b1">runtime</text>
  <text x="362" y="543" text-anchor="middle" class="b2">Harness · Evaluator</text>
  <text x="362" y="566" text-anchor="middle" class="b2">Hooks · Debugger</text>

  <!-- multi-agents -->
  <rect x="458" y="498" width="180" height="86" rx="10" fill="url(#card)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <text x="548" y="520" text-anchor="middle" class="b1">multi-agents</text>
  <text x="548" y="543" text-anchor="middle" class="b2">Coordinator · MessageBus</text>
  <text x="548" y="566" text-anchor="middle" class="b2">Handoff · SubAgent</text>

  <line x1="360" y1="606" x2="360" y2="638" stroke="#A1AFCB" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ══════ L4 infra ══════ -->
  <rect x="80" y="640" width="560" height="52" rx="12" fill="url(#infra)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <rect x="80" y="644" width="3" height="44" rx="1.5" fill="#8E8BA8"/>
  <text x="360" y="662" text-anchor="middle" class="t1">infra</text>
  <text x="360" y="681" text-anchor="middle" class="t2">MySQL · 异步日志 · Prometheus · TraceEventBus · 告警</text>

  <!-- ══════ annotations ══════ -->
  <rect x="80" y="716" width="270" height="96" rx="10" fill="url(#layer)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <text x="215" y="736" text-anchor="middle" class="b1">skills/</text>
  <text x="215" y="758" text-anchor="middle" class="b2">execute</text>
  <text x="215" y="778" text-anchor="middle" class="b2">knowledge</text>
  <text x="215" y="798" text-anchor="middle" class="b2">MCP</text>

  <rect x="370" y="716" width="270" height="96" rx="10" fill="url(#layer)" stroke="#C8CFE2" stroke-width="1" filter="url(#s1)"/>
  <text x="505" y="736" text-anchor="middle" class="b1">frontend</text>
  <text x="505" y="758" text-anchor="middle" class="b2">Chat</text>
  <text x="505" y="778" text-anchor="middle" class="b2">Trace</text>
  <text x="505" y="798" text-anchor="middle" class="b2">Skill</text>

  <!-- loop -->
  <path d="M646 336 Q680 336 680 408 Q680 536 646 536" fill="none" stroke="#A1AFCB" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#a)"/>
  <text x="692" y="436" font-size="10" fill="#A0AEC0" letter-spacing="0.4" transform="rotate(90 692 436)">Think → Act → Observe</text>

</svg>
